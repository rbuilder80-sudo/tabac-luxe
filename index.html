<style>
:root{
  --bg:#faf8f4; --bg2:#f3efe7; --ink:#2b2620; --ink2:#6d6353;
  --gold:#b08d3e; --gold2:#93712c; --goldlt:#d9c08a;
  --line:#e5ddcd; --card:#ffffff; --dark:#221e19; --red:#9c2b2b;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:var(--sans);cursor:pointer}
::selection{background:var(--gold);color:#fff}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;line-height:1.15}

/* announcement */
.announce{background:var(--dark);color:#e9dfc8;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding:.5rem 1rem;overflow:hidden;white-space:nowrap}
.announce span{display:inline-block;animation:tick 26s linear infinite}
@keyframes tick{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(250,248,244,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1240px;margin:0 auto;padding:.9rem 1.4rem;display:flex;align-items:center;gap:1.6rem}
.brand{font-family:var(--serif);font-size:1.75rem;letter-spacing:.04em;white-space:nowrap}
.brand em{color:var(--gold);font-style:italic}
.brand small{display:block;font-family:var(--sans);font-size:.58rem;letter-spacing:.42em;text-transform:uppercase;color:var(--ink2);margin-top:-2px}
nav.mainnav{display:flex;gap:1.5rem;margin-left:auto}
nav.mainnav a{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);padding:.4rem 0;position:relative;transition:color .25s}
nav.mainnav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--gold);transition:width .3s}
nav.mainnav a:hover,nav.mainnav a.on{color:var(--ink)}
nav.mainnav a:hover::after,nav.mainnav a.on::after{width:100%}
.hright{display:flex;align-items:center;gap:.9rem}
.langs{display:flex;gap:.15rem}
.langs button{background:none;border:none;font-size:.68rem;letter-spacing:.08em;color:var(--ink2);padding:.25rem .35rem;text-transform:uppercase}
.langs button.on{color:var(--gold);font-weight:600}
.cartbtn{position:relative;background:var(--ink);color:#fff;border:none;padding:.55rem 1.1rem;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;display:flex;gap:.5rem;align-items:center;transition:background .25s}
.cartbtn:hover{background:var(--gold)}
.cartbtn b{background:var(--gold);color:#fff;border-radius:50%;min-width:1.25rem;height:1.25rem;display:inline-grid;place-items:center;font-size:.68rem}
.burger{display:none;background:none;border:none;font-size:1.3rem}

main{min-height:70vh}
.wrap{max-width:1240px;margin:0 auto;padding:0 1.4rem}

/* hero */
.hero{position:relative;min-height:86vh;display:grid;place-items:center;overflow:hidden;background:var(--dark)}
.hero .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62;transform:scale(1.06);animation:heroZoom 18s ease-out forwards}
@keyframes heroZoom{to{transform:scale(1)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,13,.55) 0%,rgba(20,17,13,.25) 45%,rgba(20,17,13,.72) 100%)}
.hero .inner{position:relative;text-align:center;color:#f6f1e6;padding:4rem 1.4rem;max-width:900px}
.hero .kicker{font-size:.72rem;letter-spacing:.5em;text-transform:uppercase;color:var(--goldlt);margin-bottom:1.2rem}
.hero h1{font-size:clamp(2.8rem,7vw,5.4rem);font-weight:500;letter-spacing:.01em}
.hero h1 em{color:var(--goldlt);font-style:italic}
.hero .rule{width:64px;height:1px;background:var(--gold);margin:1.6rem auto}
.hero p{font-weight:300;font-size:1.05rem;color:#e8e0cf;max-width:560px;margin:0 auto 2.2rem}
.btnrow{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:.85rem 2.1rem;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--gold);color:#fff;background:var(--gold);transition:.3s}
.btn:hover{background:var(--gold2);border-color:var(--gold2)}
.btn.ghost{background:transparent;color:#f6f1e6;border-color:rgba(246,241,230,.5)}
.btn.ghost:hover{border-color:var(--goldlt);color:var(--goldlt)}
.btn.dark{background:var(--ink);border-color:var(--ink)}
.btn.dark:hover{background:var(--gold);border-color:var(--gold)}

/* sections */
section{padding:5rem 0}
.sec-head{text-align:center;margin-bottom:3rem}
.sec-head .kicker{font-size:.68rem;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem}
.sec-head h2{font-size:clamp(2rem,4.4vw,3.1rem)}
.sec-head .rule{width:52px;height:1px;background:var(--gold);margin:1.1rem auto 0}
.alt{background:var(--bg2)}

/* category gateway */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.cat{position:relative;background:var(--card);padding:2.6rem 1.4rem 2.2rem;text-align:center;overflow:hidden;transition:.35s;cursor:pointer}
.cat .ci{height:110px;display:grid;place-items:center;margin-bottom:1.2rem}
.cat .ci img{max-height:110px;max-width:130px;object-fit:contain;transition:transform .5s}
.cat:hover .ci img{transform:translateY(-6px) scale(1.05)}
.cat h3{font-size:1.35rem;margin-bottom:.2rem}
.cat .n{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.cat::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);transition:width .4s}
.cat:hover::after{width:100%}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.6rem}
.pcard{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;position:relative;transition:box-shadow .35s,transform .35s}
.pcard:hover{box-shadow:0 18px 44px -18px rgba(43,38,32,.25);transform:translateY(-4px)}
.pimg{height:210px;display:grid;place-items:center;padding:1.4rem;background:linear-gradient(180deg,#fff,#faf6ee)}
.pimg img{max-height:100%;object-fit:contain}
.pbadge{position:absolute;top:.8rem;left:.8rem;background:var(--gold);color:#fff;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;padding:.28rem .6rem}
.pbadge.new{background:var(--ink)}
.pbody{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.pcat{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.pname{font-family:var(--serif);font-size:1.18rem;line-height:1.25}
.pdesc{font-size:.82rem;color:var(--ink2);flex:1}
.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:.4rem}
.price{font-family:var(--serif);font-size:1.4rem;color:var(--ink)}
.price small{font-size:.68rem;color:var(--ink2);font-family:var(--sans);letter-spacing:.05em}
.add{background:var(--ink);color:#fff;border:none;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;padding:.6rem .95rem;transition:.25s}
.add:hover{background:var(--gold)}
.add.ask{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.add.ask:hover{background:var(--ink);color:#fff}

/* carousel */
.caro{display:flex;gap:1.6rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:1rem;scrollbar-width:thin}
.caro>*{flex:0 0 260px;scroll-snap-align:start}

/* editorial split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch}
.split .img{min-height:420px;background-size:cover;background-position:center}
.split .txt{padding:4rem;display:flex;flex-direction:column;justify-content:center;background:var(--card)}
.split .txt .kicker{font-size:.68rem;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);margin-bottom:.9rem}
.split .txt h2{font-size:clamp(1.9rem,3.6vw,2.7rem);margin-bottom:1.1rem}
.split .txt p{color:var(--ink2);margin-bottom:1rem}
.stats{display:flex;gap:2.4rem;margin-top:1.6rem;flex-wrap:wrap}
.stat b{font-family:var(--serif);font-size:2.2rem;color:var(--gold);display:block}
.stat span{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}

/* promos */
.promos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.6rem}
.promo{background:var(--dark);color:#efe7d6;padding:2.4rem;position:relative;overflow:hidden}
.promo .badge{display:inline-block;background:var(--gold);color:#fff;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;padding:.3rem .7rem;margin-bottom:1rem}
.promo h3{font-size:1.7rem;margin-bottom:.6rem;color:#fff}
.promo p{font-size:.88rem;color:#cfc4ac;margin-bottom:1.4rem}

/* info strip */
.info{background:var(--dark);color:#e9dfc8}
.info .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem}
.info h3{color:var(--goldlt);font-size:1.5rem;margin-bottom:1rem}
.info p,.info li{font-size:.88rem;color:#cfc4ac}
.info ul{list-style:none}
.info li{display:flex;justify-content:space-between;border-bottom:1px solid rgba(233,223,200,.14);padding:.45rem 0}
.info li b{font-weight:500;color:#efe7d6}
.closed{color:var(--goldlt);font-style:italic}

/* price list */
.pl-tools{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem;align-items:center}
.pl-tools input{flex:1;min-width:220px;padding:.8rem 1.1rem;border:1px solid var(--line);background:#fff;font-family:var(--sans);font-size:.9rem}
.pl-tools select{padding:.8rem 1rem;border:1px solid var(--line);background:#fff;font-family:var(--sans)}
table.pl{width:100%;border-collapse:collapse;background:#fff;font-size:.88rem}
table.pl th{background:var(--ink);color:#fff;text-align:left;padding:.7rem 1rem;font-weight:500;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
table.pl td{padding:.55rem 1rem;border-bottom:1px solid var(--line)}
table.pl tr:hover td{background:#faf5ea}
.pl-cat{font-family:var(--serif);font-size:1.6rem;margin:2.4rem 0 .8rem;display:flex;align-items:baseline;gap:.8rem}
.pl-cat small{font-family:var(--sans);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.pl-note{font-size:.78rem;color:var(--ink2);margin-top:2rem;border-left:2px solid var(--gold);padding-left:1rem}

/* legal */
.legal{max-width:820px;margin:0 auto}
.legal h2{font-size:2.2rem;margin-bottom:.4rem}
.legal h3{font-size:1.4rem;margin:2rem 0 .6rem;color:var(--gold2)}
.legal p,.legal li{font-size:.92rem;color:var(--ink2);margin-bottom:.8rem}
.legal ul{padding-left:1.2rem}
.updated{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}

/* cart */
.cartrow{display:grid;grid-template-columns:70px 1fr auto auto;gap:1rem;align-items:center;background:#fff;border:1px solid var(--line);padding:.9rem 1.1rem;margin-bottom:.8rem}
.cartrow img{height:56px;object-fit:contain}
.qty{display:flex;align-items:center;gap:.5rem}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;font-size:1rem}
.qty button:hover{border-color:var(--gold);color:var(--gold)}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:1.4rem 0;border-top:2px solid var(--ink);margin-top:1.4rem}
.total-bar b{font-family:var(--serif);font-size:2rem}
.empty{text-align:center;padding:5rem 1rem;color:var(--ink2)}

/* admin */
.admin-bar{background:var(--dark);color:#e9dfc8;padding:.6rem 1.4rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.admin-bar button{background:var(--gold);border:none;color:#fff;padding:.35rem .9rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}
.atable{width:100%;border-collapse:collapse;background:#fff;font-size:.84rem}
.atable th{background:var(--bg2);text-align:left;padding:.6rem .8rem;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}
.atable td{padding:.5rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
.atable input,.atable select{width:100%;padding:.35rem .5rem;border:1px solid var(--line);font-size:.82rem}
.atable input[type=checkbox]{width:auto}
.mini{background:var(--ink);color:#fff;border:none;padding:.35rem .8rem;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase}
.mini.gold{background:var(--gold)}
.mini.red{background:var(--red)}
.loginbox{max-width:380px;margin:5rem auto;background:#fff;border:1px solid var(--line);padding:2.6rem;text-align:center}
.loginbox input{width:100%;padding:.8rem;margin:.8rem 0;border:1px solid var(--line)}
.tag{font-size:.62rem;background:var(--bg2);padding:.15rem .5rem;letter-spacing:.1em}

/* footer */
footer{background:var(--dark);color:#b7ab93;padding:4rem 0 2rem}
.fgrid{max-width:1240px;margin:0 auto;padding:0 1.4rem;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:2.4rem}
footer h4{color:#efe7d6;font-family:var(--serif);font-size:1.25rem;margin-bottom:1rem}
footer a,footer p,footer li{font-size:.84rem;color:#b7ab93}
footer ul{list-style:none}
footer li{margin-bottom:.45rem}
footer a:hover{color:var(--goldlt)}
.fbrand{font-family:var(--serif);font-size:1.9rem;color:#efe7d6}
.fbrand em{color:var(--gold);font-style:italic}
.legal-line{max-width:1240px;margin:2.6rem auto 0;padding:1.4rem;border-top:1px solid rgba(233,223,200,.14);font-size:.72rem;color:#8d8168;line-height:1.7}
.warn18{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid var(--red);color:var(--red);border-radius:50%;font-weight:600;font-size:.72rem;margin-right:.6rem;vertical-align:middle}

/* wa fab */
.wafab{position:fixed;right:1.4rem;bottom:1.4rem;z-index:60;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.28);transition:transform .25s}
.wafab:hover{transform:scale(1.08)}
.wafab svg{width:30px;height:30px;fill:#fff}

/* age gate */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(20,17,13,.86);display:grid;place-items:center;padding:1rem;backdrop-filter:blur(6px)}
.modal{background:var(--bg);max-width:460px;width:100%;padding:3rem 2.6rem;text-align:center;border-top:4px solid var(--gold)}
.modal h2{font-size:1.9rem;margin:.8rem 0 1rem}
.modal p{font-size:.88rem;color:var(--ink2);margin-bottom:1.8rem}
.modal .btnrow .btn{flex:1}
.agebadge{width:64px;height:64px;border:3px solid var(--red);color:var(--red);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.3rem;margin:0 auto}

#toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:.8rem 1.6rem;font-size:.8rem;letter-spacing:.1em;z-index:120;transition:transform .35s}
#toast.show{transform:translateX(-50%) translateY(0)}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
.reveal.vis{opacity:1;transform:none}

@media(max-width:960px){
  nav.mainnav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;padding:1.2rem 1.4rem;border-bottom:1px solid var(--line);gap:1rem}
  nav.mainnav.open{display:flex}
  .burger{display:block;margin-left:auto}
  .hright{margin-left:0}
  .cats{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .split .txt{padding:2.6rem 1.6rem}
  .info .cols{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .caro>*{flex-basis:210px}
  .cartrow{grid-template-columns:50px 1fr;grid-auto-rows:auto}
}
@media(max-width:560px){.cats{grid-template-columns:1fr 1fr}.fgrid{grid-template-columns:1fr}.hero h1{font-size:2.4rem}}
</style>
</head>

<header>

      <div class="langs" id="langs"></div>

</header>

<main id="app"></main>

<footer>
  <div class="fgrid">
    <div>
      <div class="fbrand">Tabac <em>Luxe</em></div>
      <p data-i18n="footer.tag" style="margin:.8rem 0 1.2rem;max-width:320px"></p>
      <p><span class="warn18">18+</span><span data-i18n="footer.age"></span></p>
    </div>
    <div>
      <h4 data-i18n="footer.visit"></h4>
      <p>Route de Longwy 549<br>L-4832<br>Luxembourg</p>
      <p style="margin-top:.6rem"><a href="mailto:info@tabacluxe.lu">info@tabacluxe.lu</a><br><a href="tel:+35228777996">+352 28 77 79 96</a></p>
    </div>
    <div>
      <h4 data-i18n="footer.hours"></h4>
      <ul>
        <li><span data-i18n="hours.monfri"></span><b>06:00 – 18:00</b></li>
        <li><span data-i18n="hours.sat"></span><b>08:00 – 17:00</b></li>
        <li><span data-i18n="hours.sun"></span><b class="closed" data-i18n="hours.closed"></b></li>
      </ul>
    </div>
    <div>
      <h4 data-i18n="footer.links"></h4>
      <ul>
        <li><a href="#/tarifs" data-i18n="nav.pricelist"></a></li>
        <li><a href="#/legal/terms" data-i18n="footer.terms"></a></li>
        <li><a href="#/legal/privacy" data-i18n="footer.privacy"></a></li>
        <li><a href="#/legal/disclaimer" data-i18n="footer.disclaimer"></a></li>
        <li><a href="#/legal/notice" data-i18n="footer.notice"></a></li>
        <li><a href="#/admin" data-i18n="footer.admin"></a></li>
      </ul>
    </div>
  </div>

let LANG = localStorage.getItem('tl_lang') || 'fr';
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.fr[k] || k;
const eur = n => n==null ? '' : '€' + Number(n).toFixed(2).replace('.',',');
const gbp = n => n==null ? '' : '£' + Number(n).toFixed(2).replace('.',',');
const FORCE_LOGO_SLUGS = new Set(['the-turner-original-50g-rouler']);
const BRAND_LOGOS = {
  agio: 'assets/brand-logos/agio.svg',
  'the turner': 'assets/brand-logos/the-turner.svg'
};
const storageUrl = path => {
  if(!path) return '';
  return /^https?:\/\//i.test(path) ? path : CONFIG.supaUrl + '/storage/v1/object/public/site-assets/' + path.replace(/^\/+/, '');
};
function brandName(name){
  const words = String(name || 'Tabac Luxe').trim().split(/\s+/).filter(Boolean);
  if(words[0] && words[0].toLowerCase()==='the' && words[1]) return `${words[0]} ${words[1]}`;
  return words[0] || 'Tabac Luxe';
}
function normBrand(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,''); }
function imageMatchesProduct(p){
  if(!p.image || FORCE_LOGO_SLUGS.has(p.slug)) return false;
  return normBrand(p.image).includes(normBrand(brandName(p.name)));
}
function brandLogoSrc(name){
  const brand = brandName(name).slice(0,28);
  const localLogo = BRAND_LOGOS[brand.toLowerCase()];
  if(localLogo) return localLogo;
  const initials = brand.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase() || 'TL';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="24" fill="#faf8f4"/><rect x="36" y="36" width="528" height="528" rx="18" fill="#fff" stroke="#d9c08a" stroke-width="10"/><text x="300" y="280" font-family="Georgia,serif" font-size="118" font-weight="700" fill="#b08d3e" text-anchor="middle">${initials}</text><text x="300" y="370" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#2b2620" text-anchor="middle">${brand.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text><text x="300" y="430" font-family="Arial,sans-serif" font-size="25" letter-spacing="5" fill="#6d6353" text-anchor="middle">TABAC LUXE</text></svg>`;
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}

let DB = { products: [], promos: [], pl: null };
const FEAT = () => DB.products.filter(p=>p.featured && p.active!==false);

async function api(path, opts={}){
  const r = await fetch(CONFIG.supaUrl + '/rest/v1/' + path, {
    ...opts,
    headers: { apikey: CONFIG.supaKey, Authorization: 'Bearer ' + CONFIG.supaKey,
      'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if(!r.ok) throw new Error(r.status);
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

async function loadData(){
  try{
    const [prods, promos] = await Promise.all([
      api('products?select=*&order=category.asc,name.asc&limit=1200'),
      api('promos?select=*&active=eq.true&order=sort.asc')
    ]);
    DB.products = prods; DB.promos = promos;
  }catch(e){
    DB.products = []; DB.promos = [];
  }
  try{
    const r = await fetch('data/price_list.json');
    DB.pl = await r.json();
  }catch(e){ DB.pl = null; }
}

/* ================= CART ================= */
let cart = JSON.parse(localStorage.getItem('tl_cart')||'{}');
function saveCart(){ localStorage.setItem('tl_cart', JSON.stringify(cart)); updateCartN(); }
function updateCartN(){ document.getElementById('cartN').textContent = Object.values(cart).reduce((a,b)=>a+b,0); }
function addToCart(slug){
  cart[slug]=(cart[slug]||0)+1; saveCart();
  const p = DB.products.find(x=>x.slug===slug);
  toast((p?p.name:'') + ' ' + t('toast.added'));
}
function setQty(slug,q){ if(q<=0) delete cart[slug]; else cart[slug]=q; saveCart(); render(); }
function cartTotal(){
  return Object.entries(cart).reduce((s,[sl,q])=>{
    const p=DB.products.find(x=>x.slug===sl); return s + (p&&p.price_eur? p.price_eur*q : 0);
  },0);
}
function waCart(){
  const lines = Object.entries(cart).map(([sl,q])=>{
    const p=DB.products.find(x=>x.slug===sl);
    return p ? `• ${q} × ${p.name}${p.price_eur? ' — '+eur(p.price_eur):''}` : '';
  }).filter(Boolean);
  const msg = `${t('wa.hello')}\n\n${lines.join('\n')}\n\n${t('wa.total')}: ${eur(cartTotal())}\n${t('wa.pickup')}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');
}
function waAsk(p){
  const msg = `Bonjour Tabac Luxe, quel est le prix de : ${p.name} ? / Hello, price please: ${p.name}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');
}

/* ================= HELPERS ================= */
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}
function productCard(p){
  const imgUrl = imageMatchesProduct(p) ? storageUrl(p.image) : brandLogoSrc(p.name);
  const logoName = String(p.name || 'Tabac Luxe').replace(/"/g,'&quot;');
  const img = imgUrl ? `<img src="${imgUrl}" alt="${p.name} — ${t('cat.'+p.category)||p.category} at Tabac Luxe" data-logo-name="${logoName}" loading="lazy" decoding="async" onerror="this.replaceWith(productLogo(this.dataset.logoName))">` :
    `<div style="font-family:var(--serif);font-size:2.6rem;color:var(--goldlt)">${p.name.split(' ')[0]}</div>`;
  const badge = p.deal? `<span class="pbadge">${t('card.deal')}</span>` : (p.featured? `<span class="pbadge new">${t('card.featured')}</span>`:'');
  const priceHtml = p.price_eur!=null
    ? `<div class="price">${eur(p.price_eur)}${p.unit_price? `<br><small>${eur(p.unit_price)}/${p.unit==='kg'?'kg':'st.'}</small>`:''}</div>
       <button class="add" onclick="addToCart('${p.slug}')">${t('card.add')}</button>`
    : `<div></div><button class="add ask" onclick='waAsk(${JSON.stringify(p)})'>${t('card.ask')}</button>`;
  return `<div class="pcard reveal" onclick="openProduct('${p.slug}',event)" style="cursor:pointer" role="link" tabindex="0" onkeydown="if(event.key==='Enter')openProduct('${p.slug}',event)">${badge}<div class="pimg">${img}</div>
    <div class="pbody"><div class="pcat">${t('cat.'+p.category)||p.category}</div>
    <div class="pname">${p.name}</div>
    <div class="pfoot">${priceHtml}</div></div></div>`;
}
function openProduct(slug,ev){
  if(ev && ev.target.closest('button.add')) return; // let the Add-to-cart button work
  window.location.href='product/'+encodeURIComponent(slug)+'.html';
}
function productLogo(name){
  const el=document.createElement('div');
  el.style.cssText='font-family:var(--serif);font-size:2rem;color:var(--gold);text-align:center;line-height:1.1;padding:.5rem';
  el.textContent=(name||'Tabac Luxe').split(' ').slice(0,2).join(' ');
  return el;
}
function revealInit(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('vis'); io.unobserve(e.target);} }),{threshold:.12});
  document.querySelectorAll('.reveal:not(.vis)').forEach(el=>io.observe(el));
}

window.plFilter = function(){
  const q=(document.getElementById('plq').value||'').toLowerCase();
  const c=document.getElementById('plcat').value;
  document.querySelectorAll('.pl-block').forEach(b=>{
    const okc = !c || b.dataset.cat===c;
    let any=false;
    b.querySelectorAll('.plrow').forEach(r=>{
      const ok = !q || r.cells[0].textContent.toLowerCase().includes(q);
      r.style.display = ok?'':'none'; if(ok) any=true;
    });
    b.style.display = okc && any ? '' : 'none';
  });
};

let adminTab='products';
function isAdmin(){ return sessionStorage.getItem('tl_admin')==='1'; }
function adminLogin(){
  const v=document.getElementById('apass').value;
  if(v===CONFIG.adminPass){ sessionStorage.setItem('tl_admin','1'); render(); }
  else toast('—');
}
async function saveProduct(id){
  const row=document.querySelector(`tr[data-id="${id}"]`);
  const patch={
    name: row.querySelector('.f-name').value,
    price_eur: row.querySelector('.f-eur').value===''?null:parseFloat(row.querySelector('.f-eur').value.replace(',','.')),
    price_gbp: row.querySelector('.f-gbp').value===''?null:parseFloat(row.querySelector('.f-gbp').value.replace(',','.')),
    featured: row.querySelector('.f-feat').checked,
    deal: row.querySelector('.f-deal').checked,
    active: row.querySelector('.f-act').checked,
    updated_at: new Date().toISOString()
  };
  try{
    await api(`products?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(patch)});
    const p=DB.products.find(x=>x.id===id); Object.assign(p,patch);
    toast(t('admin.saved'));
  }catch(e){ toast('Error'); }
}
async function delPromo(id){
  try{ await api(`promos?id=eq.${id}`,{method:'DELETE'}); DB.promos=DB.promos.filter(p=>p.id!==id); render(); }catch(e){toast('Error');}
}
async function savePromo(id){
  const row=document.querySelector(`tr[data-pid="${id}"]`);
  const patch={ title:{...((DB.promos.find(p=>p.id===id)||{}).title||{}),fr:row.querySelector('.p-title').value},
    body:{...((DB.promos.find(p=>p.id===id)||{}).body||{}),fr:row.querySelector('.p-body').value},
    badge:row.querySelector('.p-badge').value, active:row.querySelector('.p-act').checked };
  try{
    await api(`promos?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(patch)});
    Object.assign(DB.promos.find(p=>p.id===id),patch); toast(t('admin.saved'));
  }catch(e){toast('Error');}
}
async function addPromo(){
  try{
    const r=await api('promos',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({title:{fr:'Nouvelle promotion'},body:{fr:''},badge:'Promo',active:true,sort:99})});
    DB.promos.push(r[0]); render();
  }catch(e){toast('Error');}
}
function viewAdmin(){
  if(!isAdmin()) return `<section><div class="wrap"><div class="loginbox">
    <h2 class="serif" style="font-size:1.7rem">${t('admin.login')}</h2>
    <input id="apass" type="password" placeholder="${t('admin.pass')}" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="btn dark" style="width:100%" onclick="adminLogin()">${t('admin.enter')}</button>
  </div></div></section>`;
  let body='';
  if(adminTab==='products'){
    body=`<input id="aq" placeholder="${t('admin.search')}" oninput="adminFilter()" style="padding:.7rem 1rem;border:1px solid var(--line);width:100%;max-width:340px;margin-bottom:1rem">
    <div style="overflow-x:auto"><table class="atable" id="atable"><thead><tr>
      <th>ID</th><th>Nom</th><th>Cat.</th><th>€</th><th>£</th><th>Vedette</th><th>Promo</th><th>Actif</th><th></th></tr></thead><tbody>
      ${DB.products.map(p=>`<tr data-id="${p.id}" class="arow">
        <td>${p.id}</td><td><input class="f-name" value="${p.name.replace(/"/g,'&quot;')}"></td>
        <td><span class="tag">${p.category}</span></td>
        <td style="width:90px"><input class="f-eur" value="${p.price_eur??''}"></td>
        <td style="width:90px"><input class="f-gbp" value="${p.price_gbp??''}"></td>
        <td><input type="checkbox" class="f-feat" ${p.featured?'checked':''}></td>
        <td><input type="checkbox" class="f-deal" ${p.deal?'checked':''}></td>
        <td><input type="checkbox" class="f-act" ${p.active!==false?'checked':''}></td>
        <td><button class="mini gold" onclick="saveProduct(${p.id})">${t('admin.save')}</button></td></tr>`).join('')}
    </tbody></table></div>`;
  }else{
    body=`<button class="mini gold" style="margin-bottom:1rem;padding:.6rem 1.2rem" onclick="addPromo()">+ ${t('admin.addpromo')}</button>
    <table class="atable"><thead><tr><th>Badge</th><th>Titre (FR)</th><th>Texte (FR)</th><th>Active</th><th></th></tr></thead><tbody>
    ${DB.promos.map(pr=>`<tr data-pid="${pr.id}">
      <td style="width:110px"><input class="p-badge" value="${(pr.badge||'').replace(/"/g,'&quot;')}"></td>
      <td><input class="p-title" value="${((pr.title&&pr.title.fr)||'').replace(/"/g,'&quot;')}"></td>
      <td><input class="p-body" value="${((pr.body&&pr.body.fr)||'').replace(/"/g,'&quot;')}"></td>
      <td><input type="checkbox" class="p-act" ${pr.active?'checked':''}></td>
      <td><button class="mini gold" onclick="savePromo(${pr.id})">${t('admin.save')}</button>
      <button class="mini red" onclick="delPromo(${pr.id})">${t('admin.del')}</button></td></tr>`).join('')}
    </tbody></table>`;
  }
  return `<div class="admin-bar"><span>Tabac Luxe · Admin</span><span>${t('admin.hint')} <button onclick="sessionStorage.removeItem('tl_admin');render()">${t('admin.logout')}</button></span></div>
  <section style="padding:2rem 0"><div class="wrap" style="max-width:1240px">
    <div style="display:flex;gap:.6rem;margin-bottom:1.2rem">
      <button class="mini ${adminTab==='products'?'gold':''}" onclick="adminTab='products';render()">${t('admin.products')} (${DB.products.length})</button>
      <button class="mini ${adminTab==='promos'?'gold':''}" onclick="adminTab='promos';render()">${t('admin.promos')} (${DB.promos.length})</button>
    </div>${body}
  </div></section>`;
}
window.adminFilter=function(){
  const q=(document.getElementById('aq').value||'').toLowerCase();
  document.querySelectorAll('.arow').forEach(r=>{
    r.style.display = r.querySelector('.f-name').value.toLowerCase().includes(q)?'':'none';
  });

/* ================= ROUTER / INIT ================= */
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.getElementById('announceText').textContent =
    `${t('hours.monfri')} 06:00–18:00 · ${t('hours.sat')} 08:00–17:00 · ${t('hours.sun')} ${t('hours.closed')} · ${CONFIG.address} · ${CONFIG.email} · ` + t('footer.age');
  document.getElementById('wafab').href=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(t('wa.hello'))}`;
}
function buildLangs(){
  const wrap=document.getElementById('langs');
  wrap.innerHTML=['fr','de','en','pt','lb'].map(l=>`<button class="${l===LANG?'on':''}" onclick="setLang('${l}')">${l}</button>`).join('');
}
window.setLang=function(l){ LANG=l; localStorage.setItem('tl_lang',l); buildLangs(); applyI18n(); render(); };

function ageGate(){
  if(sessionStorage.getItem('tl_adult')==='1') return;
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='ageGate';
  bg.innerHTML=`<div class="modal">
    <div class="agebadge">18+</div>
    <h2>${t('age.title')}</h2><p>${t('age.txt')}</p>
    <div class="btnrow"><button class="btn" id="ageYes">${t('age.yes')}</button>
    <button class="btn ghost" style="color:var(--ink);border-color:var(--line)" id="ageNo">${t('age.no')}</button></div>
  </div>`;
  document.body.appendChild(bg);
  document.getElementById('ageYes').onclick=()=>{sessionStorage.setItem('tl_adult','1');bg.remove();};
  document.getElementById('ageNo').onclick=()=>{bg.querySelector('.modal').innerHTML=`<h2>${t('age.sorry')}</h2>`;};
}

function route(){
  const h=(location.hash||'#/').slice(1);
  const parts=h.split('/').filter(Boolean);
  document.querySelectorAll('nav.mainnav a').forEach(a=>a.classList.toggle('on',
    a.dataset.nav===parts[0] || (!parts[0]&&a.dataset.nav==='home')));
  document.getElementById('mainnav').classList.remove('open');
  if(!parts[0]) return viewHome();
  if(parts[0]==='catalogue') return viewCatalogue(parts[1]);
  if(parts[0]==='promos') return viewPromos();
  if(parts[0]==='tarifs') return viewPriceList();
  if(parts[0]==='cart') return viewCart();
  if(parts[0]==='contact') return viewContact();
  if(parts[0]==='legal') return viewLegal(parts[1]);
  if(parts[0]==='admin') return viewAdmin();
  return viewHome();
}
async function render(){
  const app=document.getElementById('app');
  app.innerHTML=route();
  window.scrollTo({top:0});
  revealInit();
  if((location.hash||'').startsWith('#/catalogue')) catFilter();
}
window.addEventListener('hashchange',render);

(async function init(){
  buildLangs(); applyI18n(); updateCartN();
  ageGate();
  await loadData();
  render();
})();
</script>
</body>
</html>
