<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabac Luxe</title>
  <script>
    const base = "/tabac-luxe/";
    const path = window.location.pathname;
    if (path === "/tabac-luxe/category/tobacco" || path === "/tabac-luxe/category/tobacco/") {
      window.location.replace(base + "category/tobacco/index.html");
    } else if (path === "/tabac-luxe/category/spirits" || path === "/tabac-luxe/category/spirits/") {
      window.location.replace(base + "category/spirits/index.html");
    } else if (path === "/tabac-luxe/category/chocolate" || path === "/tabac-luxe/category/chocolate/") {
      window.location.replace(base + "category/chocolate/index.html");
    } else {
      window.location.replace(base);
    }
  </script>
</head>
<body>
  <p><a href="/tabac-luxe/">Tabac Luxe</a></p>
</body>
</html>
